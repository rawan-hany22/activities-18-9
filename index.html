<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل المتطوعين - قافلة 18/9</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-100 via-blue-50 to-orange-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 text-slate-800 dark:text-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 transition-colors duration-300">

    <div class="max-w-xl mx-auto bg-white/90 dark:bg-slate-900/90 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden border border-sky-100 dark:border-slate-800 transition-colors duration-300">
        
        <!-- زر تبديل الوضع المظلم / المضيء -->
        <div class="flex justify-end p-4 pb-0">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-xl bg-sky-100/70 dark:bg-slate-800 text-sky-900 dark:text-sky-300 hover:bg-sky-200 dark:hover:bg-slate-700 transition">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
                <span id="themeText">الوضع المظلم</span>
            </button>
        </div>

        <!-- الهيدر مع صورة الشعار -->
        <div class="p-6 text-center border-b border-sky-100 dark:border-slate-800 space-y-3">
            <!-- الشعار -->
            <img src="YOUR_LOGO_IMAGE_NAME.png" alt="صناع الحياة المنوفية" class="h-20 sm:h-24 mx-auto object-contain">
            
            <div class="pt-2 space-y-1">
                <!-- العنوان الرئيسي المعدل -->
                <h1 class="text-2xl sm:text-3xl font-bold text-sky-950 dark:text-sky-400 tracking-wide">
                    قافلة 18/9 ✨
                </h1>
                <!-- العنوان الفرعي -->
                <p class="text-sky-600 dark:text-sky-300 text-base sm:text-lg font-bold">
                    استمارة تسجيل المتطوعين
                </p>
            </div>
        </div>

        <!-- الاستمارة -->
        <form id="volunteerForm" onsubmit="handleSubmit(event)" autocomplete="off" class="p-6 sm:p-8 space-y-6">

            <!-- الاسم بالكامل -->
            <div>
                <label for="fullName" class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-2">
                    الاسم بالكامل <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <input type="text" id="fullName" name="fullName" autocomplete="off" required placeholder="أدخل اسمك الثلاثي أو الرباعي"
                           class="w-full pr-10 pl-4 py-3 rounded-2xl border border-sky-200 dark:border-slate-700 bg-sky-50/40 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 text-slate-700 dark:text-slate-100 text-sm transition">
                    <i class="fa-solid fa-user absolute right-3.5 top-3.5 text-sky-400"></i>
                </div>
            </div>

            <!-- رقم التليفون -->
            <div>
                <label for="phoneNumber" class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-2">
                    رقم التليفون (واتساب) <span class="text-red-400">*</span>
                </label>
                <div class="relative">
                    <input type="tel" id="phoneNumber" name="phoneNumber" autocomplete="off" required placeholder="01XXXXXXXXX" dir="ltr"
                           class="w-full text-right pr-10 pl-4 py-3 rounded-2xl border border-sky-200 dark:border-slate-700 bg-sky-50/40 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 text-slate-700 dark:text-slate-100 text-sm transition">
                    <i class="fa-solid fa-phone absolute right-3.5 top-3.5 text-sky-400"></i>
                </div>
            </div>

            <!-- الرقم القومي -->
            <div>
                <label for="nationalId" class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-1">
                    الرقم القومي <span class="text-red-400">*</span>
                </label>
                <p class="text-xs text-sky-600 dark:text-sky-400/80 mb-2">اتأكد من وجود 14 رقم</p>
                <div class="relative">
                    <input type="text" id="nationalId" name="nationalId" autocomplete="off" required maxlength="14" dir="ltr" placeholder=""
                           oninput="validateNationalId(this)"
                           class="w-full text-right pr-10 pl-4 py-3 rounded-2xl border border-sky-200 dark:border-slate-700 bg-sky-50/40 dark:bg-slate-800/60 focus:bg-white dark:focus:bg-slate-800 focus:ring-2 focus:ring-sky-400 focus:border-sky-400 text-slate-700 dark:text-slate-100 text-sm transition">
                    <i class="fa-solid fa-id-card absolute right-3.5 top-3.5 text-sky-400"></i>
                </div>
                <p id="idError" class="text-red-500 dark:text-red-400 text-xs mt-1 hidden">يجب إدخال 14 رقم بالضبط.</p>
            </div>

            <hr class="border-sky-100 dark:border-slate-800 my-6">

            <!-- السؤال الأول: المجال الطبي -->
            <div>
                <label class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-3">
                    هل أنت في المجال الطبي؟ <span class="text-red-400">*</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="isMedical" value="yes" required class="hidden">
                        <span class="font-bold text-sm text-sky-900 dark:text-sky-200">نعم</span>
                    </label>
                    <label class="flex items-center justify-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="isMedical" value="no" required class="hidden">
                        <span class="font-bold text-sm text-sky-900 dark:text-sky-200">لا</span>
                    </label>
                </div>
            </div>

            <!-- السؤال الثاني: قياس الضغط والسكر -->
            <div>
                <label class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-3">
                    بتعرف تقيس ضغط وسكر؟ <span class="text-red-400">*</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="canMeasure" value="yes" required class="hidden">
                        <span class="font-bold text-sm text-sky-900 dark:text-sky-200">نعم</span>
                    </label>
                    <label class="flex items-center justify-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="canMeasure" value="no" required class="hidden">
                        <span class="font-bold text-sm text-sky-900 dark:text-sky-200">لا</span>
                    </label>
                </div>
            </div>

            <hr class="border-sky-100 dark:border-slate-800 my-6">

            <!-- مجالات المشاركة -->
            <div>
                <label class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-3">
                    تشارك في إيه في القافلة؟ <span class="text-red-400">*</span>
                </label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="استقبال" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">استقبال</span>
                    </label>
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="تنظيم" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">تنظيم</span>
                    </label>
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="صيدليه" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">صيدليه</span>
                    </label>
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="توعية" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">توعية</span>
                    </label>
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="معرض" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">معرض</span>
                    </label>
                    <label class="flex items-center p-3 border border-sky-200 dark:border-slate-700 rounded-2xl cursor-pointer bg-sky-50/30 dark:bg-slate-800/40 hover:bg-sky-50 dark:hover:bg-slate-800 transition has-[:checked]:border-sky-500 dark:has-[:checked]:border-sky-400 has-[:checked]:bg-sky-100/80 dark:has-[:checked]:bg-sky-900/40">
                        <input type="radio" name="role" value="أبحاث" required class="w-4 h-4 text-sky-600 focus:ring-sky-400">
                        <span class="mr-2.5 text-sm font-bold text-sky-900 dark:text-sky-200">أبحاث</span>
                    </label>
                </div>
            </div>

            <!-- رفع صورة البطاقة الشخصية -->
            <div>
                <label class="block text-sm font-bold text-sky-950 dark:text-sky-200 mb-1">
                    ارفع صورة البطاقة (وجه وظهر) <span class="text-red-400">*</span>
                </label>
                <p class="text-xs text-sky-600 dark:text-sky-400/80 mb-2">يمكنك رفع صورة من هاتفك أو ملف PDF</p>
                <div class="p-5 border-2 border-sky-200 dark:border-slate-700 border-dashed rounded-2xl bg-sky-50/30 dark:bg-slate-800/30 hover:bg-sky-50 dark:hover:bg-slate-800 transition text-center">
                    <i class="fa-solid fa-id-card-clip text-3xl text-sky-500 mb-2"></i>
                    <div class="text-xs text-sky-800 dark:text-sky-200 font-medium">
                        <label for="imageUpload" class="cursor-pointer text-sky-600 dark:text-sky-400 font-bold hover:underline">
                            اختر صورة البطاقة أو ملف الـ PDF
                            <input id="imageUpload" name="imageUpload" type="file" accept="image/*,application/pdf" required class="sr-only" onchange="handleFile(this)">
                        </label>
                    </div>
                    <p id="fileName" class="text-xs text-slate-400 dark:text-slate-500 mt-1">الحد الأقصى 10 ميجابايت</p>
                </div>
            </div>

            <!-- زر الإرسال -->
            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-sky-200 dark:shadow-none transition duration-200 text-base flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>إرسال الاستمارة</span>
            </button>
        </form>
    </div>

    <!-- نافذة نجاح الإرسال (بدون رابط الواتساب مؤقتاً) -->
    <div id="successModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-7 max-w-sm w-full text-center shadow-2xl space-y-4 border border-sky-100 dark:border-slate-800">
            
            <div class="w-16 h-16 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 rounded-full flex items-center justify-center mx-auto text-3xl">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h2 class="text-xl font-extrabold text-sky-950 dark:text-sky-200">تم إرسال بياناتك بنجاح! 🎉</h2>
            <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed font-semibold">
                نتمنى إنه يكون يوم لذيذ وتجربة لذيذة عليك وتسيب أثر طيب 🤍
            </p>

            <button onclick="document.getElementById('successModal').classList.add('hidden')"
                    class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl text-xs transition mt-2 shadow-md">
                إغلاق
            </button>

        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmaMkSonVcBbzUX5Zb7ADrPS9bohhOSFpCvOVR84y-tiLARedNTIO0-i0nEFDGutedWw/exec"; 
        let fileBase64 = null;
        let fileNameVal = "";

        // التبديل بين الوضع المظلم والمضيء
        function toggleTheme() {
            const html = document.documentElement;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                themeIcon.className = "fa-solid fa-moon";
                themeText.innerText = "الوضع المظلم";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                themeIcon.className = "fa-solid fa-sun";
                themeText.innerText = "الوضع المضيء";
                localStorage.setItem('theme', 'dark');
            }
        }

        // الحفاظ على الخيار المفصل عند إعادة التحميل
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = "fa-solid fa-sun";
            document.getElementById('themeText').innerText = "الوضع المضيء";
        }

        function validateNationalId(input) {
            const idError = document.getElementById('idError');
            input.value = input.value.replace(/[^0-9]/g, '');
            
            if (input.value.length > 0 && input.value.length !== 14) {
                idError.classList.remove('hidden');
                input.setCustomValidity('الرقم القومي يجب أن يتكون من 14 رقم بالضبط');
            } else {
                idError.classList.add('hidden');
                input.setCustomValidity('');
            }
        }

        function handleFile(input) {
            const fileNameElem = document.getElementById('fileName');
            if (input.files && input.files[0]) {
                const file = input.files[0];
                
                fileNameVal = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    fileBase64 = e.target.result;
                };
                reader.readAsDataURL(file);

                fileNameElem.innerText = `تم اختيار: ${file.name}`;
                fileNameElem.classList.add('text-sky-600', 'dark:text-sky-400', 'font-bold');
            }
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const idInput = document.getElementById('nationalId');
            if (idInput.value.length !== 14) {
                document.getElementById('idError').classList.remove('hidden');
                idInput.focus();
                return;
            }

            const selectedRole = document.querySelector('input[name="role"]:checked')?.value;
            if (!selectedRole) {
                alert('برجاء اختيار مجال مشاركة واحد.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري الإرسال...</span>`;
            submitBtn.disabled = true;

            const formData = {
                fullName: document.getElementById('fullName').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                nationalId: idInput.value,
                isMedical: document.querySelector('input[name="isMedical"]:checked')?.value === 'yes' ? 'نعم' : 'لا',
                canMeasure: document.querySelector('input[name="canMeasure"]:checked')?.value === 'yes' ? 'نعم' : 'لا',
                role: selectedRole,
                fileData: fileBase64,
                fileName: fileNameVal
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('volunteerForm').reset();
                document.getElementById('fileName').innerText = 'الحد الأقصى 10 ميجابايت';
                document.getElementById('fileName').classList.remove('text-sky-600', 'dark:text-sky-400', 'font-bold');
                fileBase64 = null;

            } catch (error) {
                alert('حدث خطأ أثناء الإرسال، برجاء المحاولة لاحقاً.');
                console.error(error);
            } finally {
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
